<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vrc-karaoke</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<link rel="stylesheet" href="https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<style>
  /* 浅色(默认) */
  :root {
    --bg: #f5f6f8;
    --text: #1f2329;
    --muted: #86909c;
    --card: #ffffff;
    --hover: #f0f2f5;
    --border: #e5e6eb;
  }
  /* 深色 */
  html.dark {
    --bg: #141414;
    --text: #e5e6eb;
    --muted: #86909c;
    --card: #1d1e1f;
    --hover: #262728;
    --border: #333435;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    transition: background .2s, color .2s;
  }
  #app { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .hero { color: var(--text); margin: 0; }
  .card { margin-bottom: 16px; background: var(--card) !important; border: 1px solid var(--border) !important; }
  .song-item { padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: background .15s; border-bottom: 1px solid var(--border); }
  .song-item:hover { background: var(--hover); }
  .song-item .name { font-weight: 600; color: var(--text); }
  .song-item .artists { color: var(--muted); font-size: 13px; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .opt { display: flex; align-items: center; gap: 6px; }
  .result-box { margin-top: 16px; }
  .result-box a { color: #4a6cf7; word-break: break-all; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h2 class="hero">vrc-karaoke</h2>
    <el-radio-group v-model="theme" size="small" @change="applyTheme">
      <el-radio-button value="light">浅色</el-radio-button>
      <el-radio-button value="dark">深色</el-radio-button>
      <el-radio-button value="system">跟随系统</el-radio-button>
    </el-radio-group>
  </div>

  <el-card class="card" shadow="never">
    <el-row :gutter="8">
      <el-col :xs="24" :sm="14" :md="14">
        <el-input v-model="query" placeholder="歌名/关键词，或直接粘贴链接" clearable @keyup.enter="doSearch"></el-input>
      </el-col>
      <el-col :xs="12" :sm="4" :md="4">
        <el-select v-model="platform" placeholder="搜索平台" style="width:100%">
          <el-option label="网易云" value="netease"></el-option>
          <el-option label="QQ音乐" value="qqmusic"></el-option>
        </el-select>
      </el-col>
      <el-col :xs="6" :sm="3" :md="3">
        <el-button @click="doSearch">搜索选歌</el-button>
      </el-col>
      <el-col :xs="6" :sm="3" :md="3">
        <el-button type="primary" @click="doGenerate">直接生成</el-button>
      </el-col>
    </el-row>
  </el-card>

  <el-card class="card" shadow="never" v-if="songs.length">
    <template #header><b>搜索结果</b>（点选一首）</template>
    <div class="song-item" v-for="(s, i) in songs" :key="s.id" @click="selectSong(i)">
      <div class="name">{{ s.name }}</div>
      <div class="artists">{{ s.artists }}</div>
    </div>
  </el-card>

  <el-card class="card" shadow="never" v-if="selected">
    <template #header><b>已选歌曲</b></template>
    <span>{{ selected.name }} - {{ selected.artists }}</span>
  </el-card>

  <el-card class="card" shadow="never">
    <template #header><b>生成设置</b></template>
    <div class="opts">
      <div class="opt">
        <span>高亮</span>
        <el-select v-model="highlight" style="width:110px">
          <el-option label="自动" value=""></el-option>
          <el-option label="整句" value="line"></el-option>
          <el-option label="逐字" value="word"></el-option>
        </el-select>
      </div>
      <el-checkbox v-model="bilingual">双语</el-checkbox>
      <el-checkbox v-model="cover">封面背景</el-checkbox>
      <div class="opt">
        <span>背景色</span>
        <el-color-picker v-model="background"></el-color-picker>
      </div>
    </div>
    <div style="margin-top:16px">
      <el-button type="primary" @click="doGenerate">生成视频</el-button>
      <el-progress v-if="progressText" :percentage="progress" :status="progressStatus" style="width:320px;margin-left:16px"></el-progress>
      <span v-if="progressText" style="color:#e6a23c;margin-left:8px">{{ progressText }}</span>
    </div>
    <div class="result-box" v-html="result"></div>
  </el-card>

  <el-card class="card" shadow="never">
    <template #header><b>歌单批量生成</b>（网易云歌单链接）</template>
    <el-row :gutter="8">
      <el-col :xs="24" :sm="16" :md="16">
        <el-input v-model="playlistUrl" placeholder="https://music.163.com/playlist?id=xxx"></el-input>
      </el-col>
      <el-col :xs="24" :sm="8" :md="8">
        <el-button @click="parsePlaylist">解析歌单</el-button>
        <el-button type="primary" @click="batchGenerate" v-if="playlistName" style="margin-left:8px">批量生成</el-button>
      </el-col>
    </el-row>
    <div v-if="playlistName" style="margin-top:10px">
      <span>歌单 <b>{{ playlistName }}</b> 共 {{ playlist.length }} 首</span>
      <span v-if="batchProgress" style="color:#e6a23c;margin-left:12px">{{ batchProgress }}</span>
    </div>
  </el-card>

  <el-card class="card" shadow="never">
    <template #header>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <b>网易云登录</b>
        <span v-if="loginNickname" style="color:#67c23a">已登录：{{ loginNickname }}</span>
        <span v-else style="color:var(--muted)">未登录</span>
      </div>
    </template>
    <el-row :gutter="8">
      <el-col :xs="24" :sm="16" :md="16">
        <el-input v-model="cookie" placeholder="粘贴 cookie" clearable></el-input>
      </el-col>
      <el-col :xs="24" :sm="8" :md="8">
        <el-button @click="saveCookie">保存</el-button>
        <el-button type="success" @click="startQrLogin">扫码登录</el-button>
        <el-button v-if="loginNickname" type="danger" plain @click="logout">退出登录</el-button>
      </el-col>
    </el-row>
  </el-card>

  <el-card class="card" shadow="never">
    <template #header><b>历史记录</b></template>
    <el-table :data="history" stripe size="small" empty-text="暂无记录">
      <el-table-column prop="title" label="歌曲" min-width="200"></el-table-column>
      <el-table-column label="时间" width="170">
        <template #default="scope">{{ fmtTime(scope.row.time) }}</template>
      </el-table-column>
      <el-table-column label="操作" width="140">
        <template #default="scope">
          <a :href="'/output/' + scope.row.outPath.split('/').pop()" download style="color:#4a6cf7">下载</a>
        </template>
      </el-table-column>
    </el-table>
  </el-card>

  <el-dialog v-model="qrVisible" title="网易云扫码登录" width="320px" :close-on-click-modal="false">
    <div style="text-align:center">
      <p v-if="qrStatus === 'wait'" style="color:var(--muted)">请用网易云音乐 App 扫码</p>
      <p v-else-if="qrStatus === 'scanned'" style="color:#e6a23c">已扫码，请在手机上确认登录</p>
      <p v-else-if="qrStatus === 'expired'" style="color:#f56c6c">二维码已过期</p>
      <img v-if="qrImg" :src="qrImg" style="width:220px;height:220px">
      <div v-if="qrStatus === 'expired'" style="margin-top:8px">
        <el-button size="small" @click="startQrLogin">重新获取</el-button>
      </div>
    </div>
  </el-dialog>
</div>

<script>
const { createApp } = Vue;
const mql = window.matchMedia('(prefers-color-scheme: dark)');

createApp({
  data() {
    return {
      theme: localStorage.getItem('vrc-theme') || 'system',
      query: '',
      platform: 'netease',
      songs: [],
      selected: null,
      highlight: '',
      bilingual: false,
      cover: false,
      background: '#1a1a2e',
      progress: 0,
      progressText: '',
      progressStatus: '',
      result: '',
      playlistUrl: '',
      playlistName: '',
      playlist: [],
      batchProgress: '',
      cookie: '',
      loginNickname: '',
      history: [],
      qrVisible: false,
      qrImg: '',
      qrKey: '',
      qrStatus: 'wait',
      isSystemDark: mql.matches,
    };
  },
  methods: {
    applyTheme() {
      const isDark = this.theme === 'dark' || (this.theme === 'system' && this.isSystemDark);
      document.documentElement.classList.toggle('dark', isDark);
      localStorage.setItem('vrc-theme', this.theme);
    },
    async doSearch() {
      if (!this.query.trim()) return this.$message.warning('请输入关键词');
      const r = await this.post('/api/search', { query: this.query.trim(), platform: this.platform });
      if (!r.ok) return this.$message.error(r.error);
      this.songs = r.songs;
      if (!r.songs.length) this.$message.info('无结果');
    },
    selectSong(i) {
      this.selected = this.songs[i];
      this.songs = [];
      this.$message.success('已选: ' + this.selected.name);
    },
    bgHex() {
      return '0x' + (this.background || '#1a1a2e').replace('#', '');
    },
    async doGenerate() {
      const input = this.selected ? this.selected.url : this.query.trim();
      if (!input) return this.$message.warning('请先搜索选歌，或直接粘贴链接');
      this.progressText = '生成中...';
      this.progress = 0;
      this.result = '';
      const r = await this.post('/api/generate', {
        input,
        highlight: this.highlight || undefined,
        bilingual: this.bilingual,
        cover: this.cover,
        background: this.bgHex(),
      });
      if (!r.ok) { this.progressText = ''; return this.$message.error(r.error); }
      this.poll(r.taskId);
    },
    async parsePlaylist() {
      if (!this.playlistUrl.trim()) return this.$message.warning('请输入歌单链接');
      const r = await this.post('/api/playlist', { url: this.playlistUrl.trim() });
      if (!r.ok) return this.$message.error(r.error);
      this.playlistName = r.name;
      this.playlist = r.songs;
      this.$message.success(`歌单 ${r.name} 共 ${r.songs.length} 首`);
    },
    async batchGenerate() {
      if (!this.playlist.length) return;
      const total = this.playlist.length;
      let done = 0;
      for (const s of this.playlist) {
        await this.post('/api/generate', {
          input: `https://music.163.com/song?id=${s.id}`,
          highlight: this.highlight || undefined,
          bilingual: this.bilingual,
          cover: this.cover,
          background: this.bgHex(),
        });
        done++;
        this.batchProgress = `(${done}/${total} 已入队)`;
      }
    },
    async poll(taskId) {
      const r = await this.get('/api/task/' + taskId);
      if (r.status === 'done') {
        this.progressText = '';
        const res = r.result;
        const filename = res.outPath.split('/').pop();
        this.result = '<div style="padding:16px;background:#1f2a1f;border:1px solid #2e5a2e;border-radius:8px">' +
          '<p style="color:#67c23a;font-weight:600;margin:0 0 12px">生成完成</p>' +
          '<video src="/output/' + filename + '" controls style="width:100%;max-height:380px;border-radius:8px;background:#000;margin-bottom:12px"></video>' +
          '<a href="/output/' + filename + '" download style="display:inline-block;padding:8px 16px;background:#4a6cf7;color:#fff;border-radius:6px;text-decoration:none">下载 MP4</a>' +
          '</div>';
        this.loadHistory();
      } else if (r.status === 'failed') {
        this.progressText = '';
        this.result = '<p style="color:#f56c6c">失败: ' + r.error + '</p>';
      } else {
        this.progressText = (r.status === 'pending' ? '排队中... ' : '生成中... ');
        this.progress = Math.round((r.progress || 0) * 100);
        this.progressStatus = r.status === 'pending' ? 'warning' : '';
        setTimeout(() => this.poll(taskId), 2000);
      }
    },
    async loadHistory() {
      const r = await this.get('/api/history');
      this.history = r.ok ? r.history : [];
    },
    async saveCookie() {
      const r = await this.post('/api/config', { cookie: this.cookie.trim() });
      if (r.ok) this.$message.success(r.hasCookie ? 'cookie 已保存' : 'cookie 已清空');
      this.loadConfig();
    },
    async loadConfig() {
      const r = await this.get('/api/config');
      if (r.ok) this.loginNickname = r.nickname || '';
    },
    async logout() {
      const r = await this.post('/api/config', { cookie: '' });
      if (r.ok) { this.loginNickname = ''; this.cookie = ''; this.$message.success('已退出登录'); }
    },
    async startQrLogin() {
      const r = await this.post('/api/login/qr', {});
      if (!r.ok) return this.$message.error(r.error);
      this.qrKey = r.key;
      this.qrImg = r.qrimg ? (r.qrimg.startsWith('data:') ? r.qrimg : 'data:image/png;base64,' + r.qrimg) : '';
      this.qrStatus = 'wait';
      this.qrVisible = true;
      this.qrPoll();
    },
    async qrPoll() {
      const r = await this.get('/api/login/check?key=' + this.qrKey);
      if (r.code === 803) {
        this.qrVisible = false;
        this.$message.success('登录成功，cookie 已自动保存');
        this.loadConfig();
        return;
      } else if (r.code === 800) {
        this.qrStatus = 'expired';
        return;
      } else if (r.code === 802) {
        this.qrStatus = 'scanned';
      }
      setTimeout(() => this.qrPoll(), 2000);
    },
    fmtTime(ts) {
      return new Date(ts).toLocaleString('zh-CN');
    },
    async post(url, body) {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return r.json();
    },
    async get(url) {
      const r = await fetch(url);
      return r.json();
    },
  },
  mounted() {
    this.applyTheme();
    mql.addEventListener('change', (e) => {
      this.isSystemDark = e.matches;
      if (this.theme === 'system') this.applyTheme();
    });
    this.loadHistory();
    this.loadConfig();
  },
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
