<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vrc-karaoke · VRChat 卡拉OK歌词视频生成器</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; background: #16162a; color: #e8e8f0; }
  h1 { color: #fff; font-size: 28px; margin-bottom: 4px; }
  .sub { color: #888; margin: 0 0 24px; font-size: 14px; }
  input, select, button { font-size: 15px; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3a55; background: #23233a; color: #eee; }
  input[type=text] { flex: 1; }
  button { cursor: pointer; background: #4a6cf7; border: none; color: #fff; font-weight: 600; }
  button:hover { background: #5a7cff; }
  .row { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  .song { padding: 10px 12px; border: 1px solid #333; border-radius: 8px; margin: 6px 0; cursor: pointer; transition: background .15s; }
  .song:hover { background: #23233a; }
  .song .name { font-weight: 600; }
  .song .artists { color: #999; font-size: 13px; }
  label { font-size: 14px; color: #bbb; display: inline-flex; align-items: center; gap: 5px; }
  #progress { color: #ffcc00; }
  #result a { color: #6ab0ff; word-break: break-all; }
  .error { color: #ff7b7b; }
  .done-title { color: #6dd98c; font-weight: 600; }
</style>
</head>
<body>
<h1>🎤 vrc-karaoke</h1>
<p class="sub">VRChat 卡拉OK歌词视频生成器 · 下一句预览 + AB切换 + 逐字/双语</p>

<div class="row">
  <input type="text" id="query" placeholder="输入歌名/关键词/链接 (网易云 / YouTube / QQ音乐)">
  <select id="platform">
    <option value="">搜索:网易云</option>
    <option value="netease">搜索:网易云</option>
    <option value="qqmusic">搜索:QQ音乐</option>
  </select>
  <button onclick="doSearch()">搜索</button>
</div>

<div id="songs"></div>

<div class="row">
  <label>高亮:
    <select id="highlight">
      <option value="">自动</option>
      <option value="line">整句</option>
      <option value="word">逐字</option>
    </select>
  </label>
  <label><input type="checkbox" id="bilingual"> 双语</label>
  <label><input type="checkbox" id="upload" checked> 上传catbox直链</label>
  <label>背景 <input id="background" value="0x1a1a2e" style="width:90px"></label>
</div>

<div class="row">
  <button onclick="doGenerate()">生成视频</button>
  <span id="progress"></span>
</div>

<div id="result"></div>

<script>
let selected = null; // { name, artists, url }

async function doSearch() {
  const query = document.getElementById('query').value.trim();
  const platform = document.getElementById('platform').value;
  if (!query) return alert('请输入关键词');
  document.getElementById('songs').innerHTML = '<p>搜索中...</p>';
  const r = await fetch('/api/search', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, platform })
  }).then(r => r.json());
  if (!r.ok) return document.getElementById('songs').innerHTML = '<p class="error">错误: ' + r.error + '</p>';
  if (!r.songs.length) return document.getElementById('songs').innerHTML = '<p>无结果</p>';
  window._songs = r.songs;
  document.getElementById('songs').innerHTML = r.songs.map((s, i) =>
    `<div class="song" onclick="selectSong(${i})"><div class="name">${s.name}</div><div class="artists">${s.artists}</div></div>`
  ).join('');
}

function selectSong(i) {
  selected = window._songs[i];
  document.getElementById('songs').innerHTML = `<p>已选: <b>${selected.name}</b> - ${selected.artists}</p>`;
}

async function doGenerate() {
  const query = document.getElementById('query').value.trim();
  const input = selected ? selected.url : query;
  if (!input) return alert('请先搜索选歌,或直接输入链接');
  document.getElementById('progress').textContent = '生成中...';
  document.getElementById('result').innerHTML = '';
  const r = await fetch('/api/generate', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      input,
      highlight: document.getElementById('highlight').value || undefined,
      bilingual: document.getElementById('bilingual').checked,
      upload: document.getElementById('upload').checked,
      background: document.getElementById('background').value,
    })
  }).then(r => r.json());
  if (!r.ok) { document.getElementById('progress').textContent = ''; return alert('错误: ' + r.error); }
  poll(r.taskId);
}

async function poll(taskId) {
  const r = await fetch('/api/task/' + taskId).then(r => r.json());
  if (r.status === 'done') {
    document.getElementById('progress').textContent = '';
    const res = r.result;
    const filename = res.outPath.split('/').pop();
    let html = '<p class="done-title">✅ 生成完成</p><p><a href="/output/' + filename + '" download>📥 下载 MP4</a></p>';
    if (res.url) html += '<p>🔗 直链: <a href="' + res.url + '" target="_blank">' + res.url + '</a><br><span class="sub">贴进 VRChat 播放器即可</span></p>';
    document.getElementById('result').innerHTML = html;
  } else if (r.status === 'failed') {
    document.getElementById('progress').textContent = '';
    document.getElementById('result').innerHTML = '<p class="error">❌ 失败: ' + r.error + '</p>';
  } else {
    setTimeout(() => poll(taskId), 2000);
  }
}
</script>
</body>
</html>
